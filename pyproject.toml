[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "megakernel-lab"
version = "0.0.0"
description = "Latch research preview: generated H100 training megakernels"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3"]
[project.optional-dependencies]
cpu = ["torch==2.9.1"]
gpu = ["torch==2.9.1", "ninja"]
test = ["pytest>=8"]
huggingface = ["torch==2.9.1", "transformers==4.55.4", "ninja"]
vision = ["torch==2.9.1", "torchvision==0.24.1", "timm==1.0.30"]
tinymoe = ["torch==2.9.1", "transformers==4.55.4", "datasets==4.0.0", "safetensors==0.6.2", "pyarrow==21.0.0", "huggingface_hub==0.35.3", "ninja"]
gradlev = ["torch==2.9.1", "transformers==4.55.4", "pyarrow==21.0.0", "huggingface_hub==0.35.3", "ninja"]
learning-plots = ["matplotlib>=3.8,<4"]
[project.scripts]
latch-tinymoe = "megakernel_lab.tinymoe.__main__:main"
latch-fast = "megakernel_lab.fast_examples.__main__:main"
[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md", "LICENSE", "NOTICE", "provenance/upstream/MUON_LICENSE.txt", "provenance/upstream/LLM_RANDOM_LICENSE.txt", "provenance/upstream/PYTORCH_LICENSE.txt"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["megakernel_lab", "megakernel_lab.operation_compiler*", "megakernel_lab.fast_examples*", "megakernel_lab.tinymoe*"]
[tool.setuptools.package-data]
"megakernel_lab.operation_compiler" = ["*.json", "kernels/*.cuh", "kernels/*.cu", "vendor/*.cuh", "vendor/*.py"]
"megakernel_lab.fast_examples.recovered_release.ffn" = ["*.md", "*.txt", "*.sha256"]
"megakernel_lab.tinymoe" = ["*.json", "*.md", "*.txt"]
"megakernel_lab.tinymoe.learning" = ["*.json", "*.md"]
"*" = ["*.json", "*.cu.in", "*.cuh", "*.cu", "*.sha256", "*.md", "*.txt", "operators/*.cuh"]
[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "*.pyc"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.data-files]
"share/latch/examples" = ["examples/README.md", "examples/quickstart.py", "examples/requirements-data.txt"]
"share/latch/examples/families" = ["examples/families/prepare_data.py"]
"share/latch/examples/fast" = ["examples/fast/README.md", "examples/fast/verify_install.py"]
"share/latch/examples/gradlev" = ["examples/gradlev/README.md", "examples/gradlev/manifest.json", "examples/gradlev/quickstart.sh"]
"share/latch/examples/gradlev/gradlev_example" = ["examples/gradlev/gradlev_example/__init__.py", "examples/gradlev/gradlev_example/__main__.py", "examples/gradlev/gradlev_example/assets.py", "examples/gradlev/gradlev_example/bench.py", "examples/gradlev/gradlev_example/build.py", "examples/gradlev/gradlev_example/check_state.py", "examples/gradlev/gradlev_example/conv.py", "examples/gradlev/gradlev_example/data.py", "examples/gradlev/gradlev_example/deploy.py", "examples/gradlev/gradlev_example/evaluate.py", "examples/gradlev/gradlev_example/latch_loop.py", "examples/gradlev/gradlev_example/latch_run.py", "examples/gradlev/gradlev_example/model.py"]
"share/latch/examples/operations" = ["examples/operations/README.md", "examples/operations/dynamic_batch_example.py", "examples/operations/dynamic_batch_residual_dropout.py", "examples/operations/dynamic_batch_two_layer.py", "examples/operations/nested_workload.py", "examples/operations/train_attention_forms.py", "examples/operations/train_batch_variants.py", "examples/operations/train_conv.py", "examples/operations/train_mlp.py", "examples/operations/train_modified_attention.py", "examples/operations/train_nested_loop.py", "examples/operations/train_runtime_loop.py", "examples/operations/train_small_moe.py"]
"share/latch/examples/operations/moe_support" = ["examples/operations/moe_support/SOURCE.json", "examples/operations/moe_support/UPSTREAM.md", "examples/operations/moe_support/UPSTREAM_LICENSE.txt", "examples/operations/moe_support/__init__.py", "examples/operations/moe_support/auxiliary.py", "examples/operations/moe_support/backbone.py", "examples/operations/moe_support/fgm_model.py", "examples/operations/moe_support/model.py", "examples/operations/moe_support/moe.py", "examples/operations/moe_support/optimizer.py", "examples/operations/moe_support/recipe.py"]
"share/latch/examples/researcher" = ["examples/researcher/README.md", "examples/researcher/conventional.py", "examples/researcher/minibatches.py", "examples/researcher/model.py", "examples/researcher/workflow.py"]
"share/latch/examples/researcher/configs" = ["examples/researcher/configs/ordinary.json", "examples/researcher/configs/recurrent.json", "examples/researcher/configs/supervised.json"]
"share/latch/examples/selective_update" = ["examples/selective_update/README.md", "examples/selective_update/manifest.json", "examples/selective_update/quickstart.sh", "examples/selective_update/selective_build.py", "examples/selective_update/selective_cadence_rule.py", "examples/selective_update/selective_compare_restart.py", "examples/selective_update/selective_conventional.py", "examples/selective_update/selective_runners.py", "examples/selective_update/selective_start.py", "examples/selective_update/selective_train.py"]
"share/latch/examples/smelt_looped" = ["examples/smelt_looped/README.md", "examples/smelt_looped/example.py", "examples/smelt_looped/manifest.json", "examples/smelt_looped/quickstart.sh", "examples/smelt_looped/smelt_build.py", "examples/smelt_looped/smelt_looped.py", "examples/smelt_looped/smelt_recipe.py", "examples/smelt_looped/smelt_runners.py"]
"share/latch/examples/tinymoe" = ["examples/tinymoe/README.md", "examples/tinymoe/quickstart.sh"]
"share/latch/examples/tinymoe/reproduction" = ["examples/tinymoe/reproduction/CONFIRMATION.md", "examples/tinymoe/reproduction/FOLLOWUP.md", "examples/tinymoe/reproduction/PLAN.md", "examples/tinymoe/reproduction/README.md", "examples/tinymoe/reproduction/confirmation.json", "examples/tinymoe/reproduction/corpus-windows.json", "examples/tinymoe/reproduction/corpus.json", "examples/tinymoe/reproduction/followup.json", "examples/tinymoe/reproduction/selected-rows.bin.gz", "examples/tinymoe/reproduction/selection.json"]
"share/latch/docs" = ["docs/FAST_EXAMPLES.md", "docs/NOTES.md", "docs/RESULTS.md", "docs/SETUP.md"]
"share/latch/provenance" = ["provenance/RELEASE_EXCLUSIONS.json", "provenance/V0_NEXT_SOURCES.json", "provenance/V0_WEIGHT_EMA.json"]
"share/latch/provenance/upstream" = ["provenance/upstream/LICENSE_REVIEW.md", "provenance/upstream/LLM_RANDOM_LICENSE.txt", "provenance/upstream/MUON_LICENSE.txt", "provenance/upstream/PYTORCH_LICENSE.txt", "provenance/upstream/TINYMOE_SOURCE_INTAKE.json", "provenance/upstream/V0_LICENSE_SOURCES.json"]
"share/latch/site" = ["site/.nojekyll", "site/README.md", "site/capabilities.html", "site/get-started.html", "site/index.html", "site/methodology.html", "site/walkthrough.html"]
"share/latch/site/assets" = ["site/assets/config.js", "site/assets/favicon.svg", "site/assets/reading.js", "site/assets/site.css", "site/assets/walkthrough.js"]
"share/latch/site/profiler" = ["site/profiler/latch-profiler.html", "site/profiler/q-layer-waits.png"]
"share/latch/integration" = ["integration/V0_COMPILER_INTAKE.md", "integration/V0_COMPILER_REGRESSIONS.json", "integration/V0_COMPILER_SOURCE_INVENTORY.json", "integration/V0_PUBLIC_TEST_SCOPE.json", "integration/V0_REGRESSION_TEST_REPAIRS.json", "integration/V0_RESEARCH_TEST_EXCLUSIONS.json"]
"share/latch/scripts" = ["scripts/check_release.py"]
"share/latch" = ["README.md", "PROVENANCE.md", "THIRD_PARTY_NOTICES.md", "LICENSE", "NOTICE"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latch"
version = "0.1.0"
description = "A bare-bones compiler from PyTorch training steps to single GPU kernels"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["torch>=2.9,<2.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latch = ["latch.cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Nestor is lots of small, uneven work</title><desc id="desc">Schematic of one Nestor layer, repeated 13 times: mixing earlier layers, attention over uneven columns, and uneven experts. PyTorch runs each step as a separate kernel with its own trip to GPU memory. Latch fuses them into one program per microbatch, with reads batched and routing fused into its neighbours.</desc>

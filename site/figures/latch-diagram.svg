<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">1,024 learning steps. One kernel.</title><desc id="desc">Schematic of GradLev adapting GPT-2 small’s final MLP. Compiled PyTorch with CUDA graphs runs 18,176 kernels. Latch runs the adaptation loop in one kernel and retains the adapted MLP weights in shared memory. Other GPU-memory accesses remain. Not a timing scale.</desc>

<text x="806.0" y="180.0" font-size="34" font-weight="400" class="serif" text-anchor="start">3.5× faster</text>
<text x="806.0" y="210.0" font-size="18" font-weight="400" class="mute" text-anchor="start">test-time adaptation</text>

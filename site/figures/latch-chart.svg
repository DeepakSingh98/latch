<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">TinyMoE-200M training with Latch</title>
<desc id="desc">On one H100, Latch took 857 versus 1432 training-update seconds to validation loss 3.30 in one confirmation run at batch 32 × 1024. At batch 2 × 1024, updates took 13.63–13.77 versus 37.50–38.42 milliseconds. Each pair uses the same recipe.</desc>
<style>:root{--bg:#f8f6f0;--panel:#f0ece2;--ink:#1a1b1a;--mute:#5f615b;--rule:#c9c4b6;--blue:#2c4a80;--gray:#969288;--wash:#e3e8f1}@media(prefers-color-scheme:dark){:root{--bg:#171714;--panel:#201f1b;--ink:#ecebe5;--mute:#aaa89f;--rule:#4a4840;--blue:#a3b9e3;--gray:#77766e;--wash:#1f2738}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--mute)}.blue{fill:var(--blue)}</style>
<rect width="1200" height="900" fill="var(--bg)"/>
<text x="60" y="68" font-size="30" font-weight="600" class="" text-anchor="start">TinyMoE-200M</text>
<text x="1140" y="68" font-size="26" font-weight="400" class="muted" text-anchor="end">One H100</text>
<path d="M60 105H1140" stroke="var(--rule)" stroke-width="1"/>
<text x="60" y="188" font-size="46" font-weight="600" class="" text-anchor="start">40% less time to the same loss</text>
<text x="60" y="232" font-size="27" font-weight="400" class="muted" text-anchor="start">Training-update time · batch 32 × 1,024</text>
<text x="60" y="312" font-size="28" font-weight="600" class="blue" text-anchor="start">Latch</text>
<rect x="330" y="283" width="341.12" height="40" rx="2" fill="var(--blue)"/>
<text x="1140" y="312" font-size="28" font-weight="600" class="" text-anchor="end">14.3 min</text>
<text x="60" y="387" font-size="28" font-weight="400" class="muted" text-anchor="start">Compiled PyTorch</text>
<rect x="330" y="358" width="570.00" height="40" rx="2" fill="var(--gray)"/>
<text x="1140" y="387" font-size="28" font-weight="600" class="" text-anchor="end">23.9 min</text>
<path d="M60 461H1140" stroke="var(--rule)" stroke-width="1"/>
<text x="60" y="543" font-size="46" font-weight="600" class="" text-anchor="start">2.75× faster small-batch updates</text>
<text x="60" y="587" font-size="27" font-weight="400" class="muted" text-anchor="start">Time per update · batch 2 × 1,024</text>
<text x="60" y="667" font-size="28" font-weight="600" class="blue" text-anchor="start">Latch</text>
<rect x="330" y="638" width="205.72" height="40" rx="2" fill="var(--blue)"/>
<text x="1140" y="667" font-size="28" font-weight="600" class="" text-anchor="end">13.6–13.8 ms</text>
<text x="60" y="742" font-size="28" font-weight="400" class="muted" text-anchor="start">Compiled PyTorch</text>
<rect x="330" y="713" width="570.00" height="40" rx="2" fill="var(--gray)"/>
<text x="1140" y="742" font-size="28" font-weight="600" class="" text-anchor="end">37.5–38.4 ms</text>
<text x="60" y="845" font-size="24" font-weight="400" class="muted" text-anchor="start">Same recipe within each pair. Time-to-loss: one confirmation run.</text>
</svg>
